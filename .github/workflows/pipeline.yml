name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch

env:
  HF_USER: abhi261204   # replace with your Hugging Face username

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/prep.py

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for the server to start
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python tourism_project/model_building/train.py
  
  

  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - name: Verify Streamlit Health Endpoint
        run: |
          URL="https://tourismmlopsproject-4atjvvvk2qxsmjn7bat3hd.streamlit.app/_stcore/health"

          STATUS=$(curl -sS -o /tmp/health.txt \
            --connect-timeout 15 \
            --max-time 30 \
            -w "%{http_code}" "$URL" || true)

          echo "Health endpoint HTTP status: $STATUS"
          cat /tmp/health.txt || true

          if [ "$STATUS" = "200" ]; then
            echo "Streamlit health endpoint is responding."
          else
            echo "Health endpoint did not return HTTP 200."
            exit 1
          fi
