name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch

env:
  HF_USER: abhi261204   # replace with your Hugging Face username

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/prep.py

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for the server to start
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: python tourism_project/model_building/train.py
  
  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - name: Verify Streamlit App
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "https://tourismmlopsproject-4atjvvvk2qxsmjn7bat3hd.streamlit.app/"

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "GitHub-Actions-Health-Check"}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"Streamlit app responded with HTTP {response.status}")
                      if response.status == 200:
                          print("Deployment verification successful.")
                          break
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"Attempt {attempt}/6 failed: {error}")
                  if attempt == 6:
                      raise
              if attempt < 6:
                  time.sleep(10)
          PY
