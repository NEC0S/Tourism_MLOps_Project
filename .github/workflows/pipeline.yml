
  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - name: Verify Streamlit App
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "https://tourismmlopsproject-4atjvvvk2qxsmjn7bat3hd.streamlit.app/"

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "GitHub-Actions-Health-Check"}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"Streamlit app responded with HTTP {response.status}")
                      if response.status == 200:
                          print("Deployment verification successful.")
                          break
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f"Attempt {attempt}/6 failed: {error}")
                  if attempt == 6:
                      raise
              if attempt < 6:
                  time.sleep(10)
          PY
